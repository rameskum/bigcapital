# Builds the BigCapital server and webapp images of this fork's patches and pushes them to Docker Hub as
# <DOCKERHUB_USERNAME>/bigcapital-server and <DOCKERHUB_USERNAME>/bigcapital-webapp, each tagged
# <upstream-version>-wave and <upstream-version>-wave-<shortsha> (WAVE.md).
# Manual only. Like upstream's build-deploy-container.yml it builds packages/<server|webapp>/Dockerfile with the
# repository root as the context, but for linux/amd64 only (the homelab that runs the images is amd64); the upstream
# version is the nearest v* release tag the dispatched commit descends from, so the fork must hold that tag.
#
# Runs on the owner's self-hosted runner (label homelab-ci), so the fork must be in the installation of the owner's
# hlx-homelab-ci GitHub App. Keep workflow_dispatch as the only trigger: only people with write access can start it,
# so no outside pull request can run these jobs on that runner.
#
# Needs the repository variable DOCKERHUB_USERNAME and the repository secret DOCKERHUB_TOKEN (a Docker Hub access
# token with Read & Write scope). The images are public and hold no secrets: configuration comes at run time.
name: Publish Wave images

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-wave-image
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push the ${{ matrix.image }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            description: with the invoice PDF in a Wave-style layout and line amounts before tax
          - image: webapp
            description: with the edit form totals fix
    runs-on: homelab-ci
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check the Docker Hub settings
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ]; then
            echo "::error::Set the repository variable DOCKERHUB_USERNAME (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ "${HAS_TOKEN}" != "true" ]; then
            echo "::error::Set the repository secret DOCKERHUB_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release tags, to name the upstream version
          persist-credentials: false

      - name: Name the image
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          if ! version="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)"; then
            echo "::error::No v* release tag is an ancestor of ${GITHUB_SHA}; push the upstream tag to the fork (WAVE.md)."
            exit 1
          fi
          short="$(git rev-parse --short=7 HEAD)"
          repo="${DOCKERHUB_USERNAME}/bigcapital-${IMAGE}"
          {
            echo "version=${version}"
            echo "repo=${repo}"
            echo "tags=${repo}:${version}-wave,${repo}:${version}-wave-${short}"
          } | tee -a "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./
          file: ./packages/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          # Each runner is deleted after its job, so the layer cache lives in the GitHub Actions cache.
          # mode=max keeps the builder stage too; a failed cache export does not fail a pushed build.
          # One cache scope per image, so neither build evicts the other's cache entry.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max,ignore-error=true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=bigcapital-${{ matrix.image }}
            org.opencontainers.image.description=BigCapital ${{ matrix.image }} ${{ steps.image.outputs.version }} ${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}-wave
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Print the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO: ${{ steps.image.outputs.repo }}
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          set -euo pipefail
          echo "Pushed ${TAGS}"
          echo "Digest: ${DIGEST}"
          echo "Pin: docker.io/${REPO}@${DIGEST}"
          {
            echo "### Published ${REPO}"
            echo
            echo "- Tags: \`${TAGS}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Pin: \`docker.io/${REPO}@${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
