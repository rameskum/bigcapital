# Builds the BigCapital server image of this fork's Wave invoice patch and pushes it to Docker Hub as
# <DOCKERHUB_USERNAME>/bigcapital-server:<upstream-version>-wave and :<upstream-version>-wave-<shortsha> (WAVE.md).
# Manual only. It builds exactly as upstream's build-deploy-container.yml does (the repository root as the context,
# packages/server/Dockerfile, linux/amd64 and linux/arm64); the upstream version is the nearest v* release tag the
# dispatched commit descends from, so the fork must hold that tag.
#
# Needs the repository variable DOCKERHUB_USERNAME and the repository secret DOCKERHUB_TOKEN (a Docker Hub access
# token with Read & Write scope). The image is public and holds no secrets: configuration comes at run time.
name: Publish Wave server image

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-wave-image
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check the Docker Hub settings
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ]; then
            echo "::error::Set the repository variable DOCKERHUB_USERNAME (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ "${HAS_TOKEN}" != "true" ]; then
            echo "::error::Set the repository secret DOCKERHUB_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release tags, to name the upstream version
          persist-credentials: false

      - name: Name the image
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if ! version="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)"; then
            echo "::error::No v* release tag is an ancestor of ${GITHUB_SHA}; push the upstream tag to the fork (WAVE.md)."
            exit 1
          fi
          short="$(git rev-parse --short=7 HEAD)"
          repo="${DOCKERHUB_USERNAME}/bigcapital-server"
          {
            echo "version=${version}"
            echo "repo=${repo}"
            echo "tags=${repo}:${version}-wave,${repo}:${version}-wave-${short}"
          } | tee -a "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./
          file: ./packages/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=bigcapital-server
            org.opencontainers.image.description=BigCapital server ${{ steps.image.outputs.version }} with the invoice PDF in a Wave-style layout
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}-wave
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Print the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO: ${{ steps.image.outputs.repo }}
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          set -euo pipefail
          echo "Pushed ${TAGS}"
          echo "Digest: ${DIGEST}"
          echo "Pin: docker.io/${REPO}@${DIGEST}"
          {
            echo "### Published"
            echo
            echo "- Tags: \`${TAGS}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Pin: \`docker.io/${REPO}@${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
